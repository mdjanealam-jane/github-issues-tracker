<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    
    <!-- tailwind css and daisyUi -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome and google fonts-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        *{
            font-family: sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg border-2 border-blue-400 w-full max-w-md shadow-sm relative">
            <div class="flex flex-col items-center mb-6">
                <i class="fa-brands fa-github text-5xl text-slate-800 mb-4"></i>
                <h1 class="text-2xl font-bold text-slate-800">GitHub Issues Tracker</h1>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <input type="text" id="username" placeholder="Enter Username" class="w-full border border-slate-300 rounded-md px-4 py-2 mb-2">
                </div>
                <div>
                    <input type="password" id="password" placeholder="Enter Password" class="w-full border border-slate-300 rounded-md px-4 py-2">
                </div>
                <button type="submit" class="w-full bg-purple-900 text-white py-3 rounded-md">Sign In</button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <nav class="bg-white px-6 py-3 flex justify-between border-b-2 border-blue-600">
            <h1 class="text-lg font-bold"><i class="fa-brands fa-github text-slate-800 text-lg"></i> GitHub Issues Tracker</h1>
            <input type="text" id="search" placeholder="Search Issues...." class="border rounded-md px-2 py-1">
        </nav>
        <div class="felx-1 p-6">
            <div id="tab-container" class="mb-6 flex gap-2">
                <button class="tab-btn bg-purple-800 text-white px-4 py-1 rounded">All</button>
                <button class="tab-btn bg-white px-4 py-1 rounded border">Open</button>
                <button class="tab-btn bg-white px-4 py-1 rounded border">Closed</button>
            </div>

            <h2 class="font-bold text-lg mb-4"><span id="count-issues">0 </span> Issues</h2>
            <div id="loading" class="hidden flex justify-center py-10">
                <div class="loading"></div>
            </div>
            <div id="issue-card" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </div>

    <div id="issue" class="hidden fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-xl w-full max-w-2xl overflow-hidden shadow-2xl relative">
            <div class="p-6 border-b border-gray-100">
                <h3 id="popup-title" class="text-2xl font-bold text-slate-800 pr-8">Loading....</h3>

                <div class="flex flex-wrap items-center gap-2 mt-3 text-xs">
                    <span id="popup-status" class="px-3 py-1 rounded-full font-bold text-white bg-green-500">Opened</span>
                    <span class="text-gray-500"> Opened by <span id="author" class="font-semibold text-gray-700">...</span></span>
                    <span class="text-gray-500">. <span id="date">...</span></span>
                </div>
            </div>
            <div class="p-6">
                <p id="popup-description" class="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap min-h-[80px]">...</p>
            </div>
            <div class="bg-gray-50 p-6 flex flex-wrap items-center justify-between border-t border-gray-100">
                <div class="flex gap-30">
                    <div>
                        <p class="text-xs text-gray-500 mb-1">Assignee:</p>
                        <p id="assignee" class="font-bold text-m text-gray-800">...</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-1">Priority:</p>
                        <span id="priority" class="text-[10px] font-bold px-2 py-1 rounded-full bg-red-500 text-white uppercase">...</span>
                    </div>
                </div>
                <button id="close" class="bg-slate-600 hover:bg-purple-800 text-white px-6 py-2 rounded-lg font-semibold transition-colors">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
